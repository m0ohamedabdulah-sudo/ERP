name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Placeholder: ESLint for src/lib is not configured yet.
        # Add eslint.config.mjs + a "lint:lib" script, then replace this step.
        run: 'echo "lint: not configured for src/lib yet (deferred)"'

      - name: Unit tests
        run: npm test

      - name: Validate Prisma schema
        # NOTE: `prisma validate` downloads the query engines on first run,
        # so this step needs network access to Prisma's CDN.
        run: npx prisma validate

      - name: Build
        run: npm run build
